<title>اذکار صبح و مساء</title>
<style>
:root{--bg:#e9f0ec;--paper:#fbfdfb;--ink:#0f2a2b;--mute:#587070;--line:#9db5ad;--acc:#0e5c5a;--ada:#1f7a4d;--ada-bg:#d5eddf;--qaza:#a8650b;--qaza-bg:#fbe7c4;--ozr:#8a3b52;--ozr-bg:#f6d9e1;--head:#0e3d3b;--headtx:#e8f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a1a;--paper:#112424;--ink:#e3efea;--mute:#8fa9a3;--line:#2e4947;--acc:#59c2b8;--ada:#7fdca6;--ada-bg:#173d2b;--qaza:#f0b45a;--qaza-bg:#4a3511;--ozr:#f19ab3;--ozr-bg:#47202d;--head:#173533;--headtx:#e3efea}}
:root[data-theme="dark"]{--bg:#0b1a1a;--paper:#112424;--ink:#e3efea;--mute:#8fa9a3;--line:#2e4947;--acc:#59c2b8;--ada:#7fdca6;--ada-bg:#173d2b;--qaza:#f0b45a;--qaza-bg:#4a3511;--ozr:#f19ab3;--ozr-bg:#47202d;--head:#173533;--headtx:#e3efea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:16px 12px 60px}
h1{font-size:1.5rem;margin:8px 0}
.back{display:inline-block;padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;color:var(--acc);text-decoration:none;font-weight:600}
article{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px;scroll-margin-top:12px}
article h2{font-size:1.1rem;margin:0 0 10px;color:var(--acc)}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.video-download{display:inline-flex;margin-top:8px;padding:4px 10px;border:1.5px solid var(--line);border-radius:4px;text-decoration:none;font-weight:600;font-size:.85rem}
.ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:1.6rem;line-height:2.1;text-align:center;margin:14px 0 6px}
.tr{margin:6px 0}
.ct{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:var(--ada-bg);color:var(--ada);font-weight:600;font-size:.9rem}
:root{--bg:#f0f4ef;--paper:#ffffff;--ink:#18332d;--mute:#5f746d;--line:#d3ded7;--acc:#176b58;--ada:#176f48;--ada-bg:#dff2e7;--qaza:#935a08;--qaza-bg:#fbebc9;--ozr:#9b4054;--ozr-bg:#f7dfe4;--head:#1c453a;--headtx:#f2f7f2}
body{background-image:linear-gradient(180deg,var(--paper),var(--bg) 24rem)}
main{max-width:780px;padding:26px 18px 64px}
h1{font-size:1.75rem;line-height:1.35;margin:16px 0 22px}
.back{display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:6px;background:var(--paper);font-size:1.55rem;line-height:1;text-decoration:none}
article{padding:18px;margin-bottom:16px;border:1px solid var(--line);border-right:4px solid var(--acc);border-radius:8px;box-shadow:0 10px 26px -24px rgba(24,51,45,.55)}
article h2{font-size:1.05rem;margin-bottom:12px}
video{border-radius:6px}
.ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:1.7rem;line-height:2.15;margin:18px 0 10px}
.tr{line-height:1.9}
.ct{border-radius:4px;padding:5px 10px}
.video-download{border-color:var(--line);border-radius:6px;background:var(--paper)}
.azkar-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.theme-toggle{display:inline-flex;flex:none;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.theme-toggle button{all:unset;display:grid;place-items:center;width:40px;height:34px;border-radius:999px;color:var(--mute);cursor:pointer}
.theme-toggle button.active{background:var(--acc);color:var(--paper)}
.theme-toggle button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){main{padding:16px 10px 44px}article{padding:14px}.ar{font-size:1.5rem}}
</style>
</head>

<script>
const Z={"1": ["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "به نام خدایی که با نام وی هیچ چیز در زمین و آسمان، گزندی نمی‌رساند، و او شنوا و دانا است.", "سه مرتبه صبح و سه مرتبه شام"], "2": ["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", "به ربوبیتِ الله، و به داشتن دینِ اسلام، و پیامبریِ محمد صلی‌الله‌علیه‌وسلم راضی و خشنود هستم.", "سه مرتبه صبح و سه مرتبه شام"], "3": ["لا إلهَ إلا اللهُ وحدَهُ لا شريكَ لهُ، لهُ الملكُ ولهُ الحمدُ، وهوَ على كلِّ شيءٍ قدير", "هیچ معبودی به جز الله وجود ندارد، یکتاست و شریکی برای او نیست، پادشاهی و حمد از آنِ اوست، و او بر هر چیز تواناست.", "ده مرتبه صبح و ده مرتبه شام"], "4": ["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", "بار الها! از تو علم سودمند، رزق پاک و عمل مقبول مسألت می‌نمایم.", "یک مرتبه صبح و یک مرتبه شام"], "5": ["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "بار الها! ای داننده‌ی نهان و آشکار، آفریننده‌ی آسمان‌ها و زمین، پروردگار و مالک هر چیز، من گواهی می‌دهم که جز تو، معبود دیگری نیست. از شر نفس و از شر شیطان و دام فریبش، و از اینکه خود مرتکب کار بدی شوم یا به مسلمانی بدی برسانم، به تو پناه می‌برم.", "یک مرتبه صبح و یک مرتبه شام"], "6": ["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "الهی! عفو و عافیت دنیا و آخرت را از تو می‌خواهم. بار الهی! عفو و عافیت دین، دنیا، خانواده و مالم را از تو مسئلت می‌نمایم. بار الهی! عیوب مرا بپوشان و ترس مرا به ایمنی مبدل ساز. الهی! مرا از جلو، پشت سر، سمت راست و چپ و بالای سرم محافظت بفرما، و به بزرگی و عظمت تو پناه می‌برم از اینکه بطور ناگهانی از طرف پایین کشته شوم.", "یک مرتبه صبح و یک مرتبه شام"], "7": ["يا حيُّ يا قيومُ برحمتِكَ أستغيثُ، أصلِح لي شأني كلَّهُ ولا تَكِلني إلى نفسي طرفةَ عين", "ای زنده و ای برپا دارنده! به وسیله‌ی رحمت تو از تو کمک می‌خواهم، همه‌ی امورم را اصلاح بفرما، و مرا به اندازه‌ی یک چشم به هم زدن به حال خود رها مکن.", "یک مرتبه صبح و یک مرتبه شام"], "8": ["اللّٰهُمَّ عَافِنِي فِي بَدَنِي، اللّٰهُمَّ عَافِنِي فِي سَمْعِي، اللّٰهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلٰهَ إِلَّا أَنْتَ. اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلٰهَ إِلَّا أَنْتَ", "بار الها! در بدنم عافیت ده، بار الها! در گوشم عافیت ده، خدایا! در چشمم عافیت ده، بجز تو معبود دیگری «بحق» وجود ندارد، از کفر به تو پناه می‌برم، از فقر به تو پناه می‌برم، از عذاب قبر به تو پناه می‌برم، بجز تو معبود دیگری «بحق» وجود ندارد.", "سه مرتبه صبح و سه مرتبه شام"], "9": ["حَسْبِيَ اللَّهُ لا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "الله برای من کافی است، بجز او معبود دیگری (بحق) نیست، بر او توکل کردم و او پروردگار عرش بزرگ است.", "هفت مرتبه صبح و هفت مرتبه شام"], "10": ["اللَّهُمَّ أَنْتَ رَبِّي لا إِلٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "خدایا! تو پروردگار منی، هیچ معبودی جز تو نیست، مرا آفریدی، و من بندهٔ تو هستم، تا آنجا که توان دارم بر پیمان و وعده‌ی تو ایستاده‌ام، از شر آنچه کرده‌ام به تو پناه می‌برم، نعمت‌های تو را بر خود می‌پذیرم، و به گناهانم اعتراف می‌کنم، پس مرا بیامرز، زیرا جز تو هیچ کس گناهان را نمی‌آمرزد.", "یک مرتبه صبح و یک مرتبه شام"], "12": ["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "ما و تمام جهانیان برای خدا به شب رسیدیم و حمد از آن خداست، هیچ معبودی بجز الله که یکتاست و شریکی ندارد، وجود ندارد، پادشاهی و حمد فقط از آن اوست و او بر هر چیز قادر است. الهی! من خیر آنچه در این شب است و خیر آنچه بعد از آن است را از تو می‌طلبم، و از شر آنچه در این شب است و شر آنچه بعد از آن است به تو پناه می‌برم. الهی! از تنبلی و بدی پیری به تو پناه می‌برم. الهی! از عذاب آتش و عذاب قبر به تو پناه می‌برم.", ""], "13": ["اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", "بار الهٰا! با لطف تو صبح کردیم، و با عنایت تو به شب رسیدیم، و به خواست تو زنده‌ایم، و به خواست تو می‌میریم، و رستاخیز ما بسوی تو است.", "یک مرتبه صبح"], "14": ["اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ", "بار الها! با لطف تو به شب رسیدیم، و با عنایت تو صبح کردیم، و به خواست تو زنده‌ایم، و به خواست تو می‌میریم، و رستاخیز ما بسوی تو است.", "یک مرتبه شام"], "15": ["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هٰذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ", "ما و تمام جهانیان، شب را به صبح رساندیم برای خدایی که پروردگار جهانیان است. بار الها! من از تو خوبی امروز، یعنی فتح، پیروزی، نور، برکت و هدایتش را مسألت می‌نمایم و از بدی آنچه امروز و بعد از آن پیش می‌آید، به تو پناه می‌برم.", "یک مرتبه صبح"], "16": ["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ: فَتْحَهَا، وَنَصْرَهَا، وَنُورَهَا، وَبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا", "ما و تمام جهانیان، به شب رسیدیم برای خدایی که پروردگار جهانیان است. بار الها! من از تو خوبی امشب یعنی فتح، پیروزی، نور، برکت و هدایتش را مسئلت می‌نمایم و از بدی امشب و بعد از آن، به تو پناه می‌برم.", "یک مرتبه شام"], "18": ["أَمْسَيْنَا عَلَى فِطْرَةِ الإِسْلَامِ، وَعَلَى كَلِمَةِ الإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "ما بر فطرت اسلام، کلمه‌ی اخلاص، دین پیامبرمان محمد صلی الله علیه و سلم و آیین پدرمان ابراهیم؛ به شب رسیدیم، همان ابراهیمی که فقط به سوی حق، تمایل داشت و فرمانبردار خداوند بود، و از مشرکان نبود.", "یک مرتبه شام"], "19": ["اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ", "الهی! من در این صبح‌گاه، تو را و حاملان عرش و تمام فرشتگانت و کلیه مخلوقات تو را گواه می‌گیرم بر این که تو الله هستی، بجز تو معبود دیگری «بحق» وجود ندارد، تو یگانه‌ای و شریکی نداری، و محمد صلی الله علیه و سلم، بنده و فرستادهٔ تو است.", "چهار مرتبه صبح"], "20": ["اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ", "الهی! من در این شام‌گاه، تو را و حاملان عرش و تمام فرشتگانت و کلیه مخلوقات تو را گواه می‌گیرم بر این که تو الله هستی، بجز تو معبود دیگری (بحق) وجود ندارد، تو یگانه‌ای و شریکی نداری، و محمد صلی الله علیه و سلم بنده و فرستاده‌ی تو است.", "چهار مرتبه شام"], "21": ["اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", "الهی! هر نعمتی که در این صبح، شامل حال من یا یکی از مخلوقات شده، از طرف تو بوده است، تو شریکی نداری، پس ستایش و شکر از آنِ تو است.", "یک مرتبه صبح"], "22": ["اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", "الهی! هر نعمتی که در این شام، شامل حال من یا یکی از مخلوقات شده، از طرف تو بوده است، تو شریکی نداری، پس ستایش و شکر از آنِ تو است.", "یک مرتبه شام"], "23": ["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", "تسبیح و پاکی الله و ستایش او را به تعداد آفریدگانش، خشنودی‌اش و سنگینی عرش‌اش و جوهر سخنانش، بیان می‌نماییم.", "سه مرتبه صبح و سه مرتبه شام"], "24": ["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "پاک و منزه است خداوند، و من ستایش او را بیان می‌کنم.", "صد مرتبه صبح، صد مرتبه شام"], "25": ["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "از الله طلب آمرزش می‌کنم و به سوی او برمی‌گردم.", "صد مرتبه در یک شبانه‌روز"]};
Z["17"] = ["أَصْبَحْنَا عَلَى فِطْرَةِ الإِسْلَامِ، وَعَلَى كَلِمَةِ الإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "ما بر فطرت اسلام، کلمه‌ی اخلاص، دین پیامبرمان محمد صلی الله علیه و سلم و آیین پدرمان ابراهیم؛ صبح کردیم، همان ابراهیمی که فقط به سوی حق، تمایل داشت و فرمانبردار خداوند بود، و از مشرکان نبود.", "یک مرتبه صبح"];
const list=document.getElementById("list");

for(let n=1;n<=25;n++){
  const z=Z[n];
  list.insertAdjacentHTML("beforeend",`<article id="z${n}"><h2>ذکر شماره ${persianNumbers[n-1]}</h2><video controls playsinline preload="metadata" src="${n}.mp4"></video><a class="video-download" href="${n}.mp4" download="${n}.mp4" aria-label="دانلود ویدیوی ذکر شماره ${persianNumbers[n-1]}">دانلود ویدیو</a>`+(z?`<p class="ar" lang="ar" dir="rtl">${z[0]}</p><p class="tr"><b>ترجمه:</b> ${z[1]}</p>${z[2]?`<span class="ct">${z[2]}</span>`:""}`:"")+`</article>`);
}
const themeButtons=[...document.querySelectorAll("[data-theme-choice]")];
function applyTheme(){let theme="";try{theme=localStorage.getItem("ibadah-theme")||"dark"}catch(e){}if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;const isDark=theme?theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;themeButtons.forEach(button=>{const active=button.dataset.themeChoice===(isDark?"dark":"light");button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active))})}
themeButtons.forEach(button=>button.onclick=()=>{try{localStorage.setItem("ibadah-theme",button.dataset.themeChoice)}catch(e){}applyTheme()});
applyTheme();
window.addEventListener("storage",event=>{if(event.key==="ibadah-theme")applyTheme()});
</script>
